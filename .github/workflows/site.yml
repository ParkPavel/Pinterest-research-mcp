name: Site checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check site JavaScript and static links
        run: |
          node --check docs/site.js
          node --check docs/content.mjs
          node --test scripts/site.test.mjs
      - name: Verify content generation
        run: node scripts/sync-site.mjs
